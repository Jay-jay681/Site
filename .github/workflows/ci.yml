name : CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siteflow_ci
        ports:
          - 5432:5432
        options: >-
                    --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: siteflow_ci

    steps:
    - name: Get the code
      uses: actions/checkout@v4

    - name: Set up Python  
      uses: actions/setup-python@v5
      with:
        python-version: 3.13
        cache: pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: check the project
      run: python manage.py check

    - name: Run tests
      run: python manage.py test